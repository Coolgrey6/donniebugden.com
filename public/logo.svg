<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="46" fill="#090D16" stroke="#1E293B" stroke-width="2" />
  
  <!-- Outer Concentric Shells (phi ratio) -->
  <circle cx="50" cy="50" r="38" stroke="#1E293B" stroke-dasharray="2 4" stroke-width="1.5" />
  <circle cx="50" cy="50" r="23.5" stroke="#06B6D4" stroke-opacity="0.5" stroke-dasharray="1 3" stroke-width="1.5" />

  <!-- 8-Fold / 10-Fold Coxeter H4 Geodesics -->
  <g stroke="url(#cyanAmber)" stroke-width="1.2" opacity="0.85">
    <polygon points="50,12 86,38 72,80 28,80 14,38" fill="none" />
    <polygon points="50,88 14,62 28,20 72,20 86,62" fill="none" />
    <polygon points="50,15 80,50 50,85 20,50" stroke="#06B6D4" stroke-width="1.5" fill="none" />
  </g>

  <!-- Central E8/Julia Core -->
  <circle cx="50" cy="50" r="5" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="50" cy="50" r="2" fill="#FFFFFF" />

  <!-- Chiral Invariant Nodes -->
  <circle cx="50" cy="12" r="2.5" fill="#06B6D4" />
  <circle cx="86" cy="38" r="2.5" fill="#F59E0B" />
  <circle cx="72" cy="80" r="2.5" fill="#06B6D4" />
  <circle cx="28" cy="80" r="2.5" fill="#F59E0B" />
  <circle cx="14" cy="38" r="2.5" fill="#06B6D4" />
</svg>
