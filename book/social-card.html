<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #090D16; }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background:
        radial-gradient(900px 420px at 88% 18%, rgba(6, 182, 212, 0.16), transparent 60%),
        radial-gradient(700px 480px at 8% 100%, rgba(245, 158, 11, 0.12), transparent 55%),
        radial-gradient(500px 360px at 70% 110%, rgba(16, 185, 129, 0.12), transparent 50%),
        #090D16;
      color: #e2e8f0;
      font-family: Inter, Helvetica, sans-serif;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(closest-side at 50% 50%, #000 40%, transparent 100%);
      pointer-events: none;
    }
    .top, .bottom { position: relative; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 22px; }
    .kicker {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 18px;
      color: #67e8f9;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 78px;
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: #f8fafc;
    }
    .sub {
      margin-top: 22px;
      max-width: 760px;
      font-size: 28px;
      line-height: 1.35;
      color: #94a3b8;
      font-weight: 400;
    }
    .pills { display: flex; gap: 14px; }
    .pill {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 16px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.72);
      color: #cbd5e1;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 8px; }
    .cyan { color: #a5f3fc; }
    .amber { color: #fde68a; }
    .emerald { color: #a7f3d0; }
    .domain {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 18px;
      color: #64748b;
      letter-spacing: 0.04em;
    }
    .bottom { display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="brand">
        <svg width="72" height="72" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="#090D16" stroke="#1E293B" stroke-width="2"/>
          <circle cx="50" cy="50" r="38" stroke="#1E293B" stroke-dasharray="2 4" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="23.5" stroke="#06B6D4" stroke-opacity="0.5" stroke-dasharray="1 3" stroke-width="1.5"/>
          <polygon points="50,12 86,38 72,80 28,80 14,38" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
          <polygon points="50,88 14,62 28,20 72,20 86,62" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
          <polygon points="50,15 80,50 50,85 20,50" stroke="#06B6D4" stroke-width="1.5" fill="none"/>
          <circle cx="50" cy="50" r="5" fill="#F59E0B"/>
          <circle cx="50" cy="50" r="2" fill="#FFFFFF"/>
          <circle cx="50" cy="12" r="2.5" fill="#06B6D4"/>
          <circle cx="86" cy="38" r="2.5" fill="#F59E0B"/>
          <circle cx="72" cy="80" r="2.5" fill="#06B6D4"/>
          <circle cx="28" cy="80" r="2.5" fill="#F59E0B"/>
          <circle cx="14" cy="38" r="2.5" fill="#06B6D4"/>
        </svg>
        <div class="kicker" style="margin:0">donniebugden.com</div>
      </div>
      <div class="kicker" style="margin-top:48px">Theoretical mathematics</div>
      <h1>Donald Bugden</h1>
      <p class="sub">Three theories of the lattice: parity, the dimensional clock, and the fold that leaves a footprint.</p>
    </div>
    <div class="bottom">
      <div class="pills">
        <span class="pill cyan"><span class="dot" style="background:#22d3ee"></span>Theory I · Parity</span>
        <span class="pill amber"><span class="dot" style="background:#fbbf24"></span>Theory II · ODT</span>
        <span class="pill emerald"><span class="dot" style="background:#34d399"></span>Theory III · Folding</span>
      </div>
      <div class="domain">E₈ · 240 roots</div>
    </div>
  </div>
</body>
</html>
