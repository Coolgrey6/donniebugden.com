<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #090D16; }
    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      background: #090D16;
      color: #e2e8f0;
      font-family: Inter, Helvetica, sans-serif;
    }
    .photo {
      position: relative;
      width: 470px;
      height: 630px;
      flex: none;
      overflow: hidden;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 62%, #090D16 98%);
      pointer-events: none;
    }
    .copy {
      flex: 1;
      padding: 56px 56px 48px 28px;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(520px 280px at 100% 0%, rgba(6, 182, 212, 0.16), transparent 60%),
        radial-gradient(420px 260px at 0% 100%, rgba(245, 158, 11, 0.1), transparent 55%),
        #090D16;
    }
    .kicker {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 15px;
      color: #67e8f9;
    }
    h1 {
      margin-top: 18px;
      font-size: 62px;
      line-height: 0.95;
      letter-spacing: -0.035em;
      font-weight: 800;
      color: #f8fafc;
    }
    .about {
      margin-top: 22px;
      font-size: 24px;
      line-height: 1.35;
      color: #cbd5e1;
      max-width: 620px;
    }
    .pills {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pill {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 16px;
      color: #e2e8f0;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 99px;
      margin-right: 10px;
    }
    .url {
      margin-top: auto;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo">
      <img src="/donnie-bugden.jpg" alt="" />
    </div>
    <div class="copy">
      <div class="kicker">Theoretical mathematics</div>
      <h1>Donald Bugden</h1>
      <p class="about">Independent research on the E₈ lattice. Three theories: parity, the dimensional clock, and lattice folding.</p>
      <div class="pills">
        <div class="pill"><span class="dot" style="background:#22d3ee"></span>Theory I · Quasicrystal parity</div>
        <div class="pill"><span class="dot" style="background:#fbbf24"></span>Theory II · Oscillating dimensions</div>
        <div class="pill"><span class="dot" style="background:#34d399"></span>Theory III · Lattice folding</div>
      </div>
      <div class="url">www.donniebugden.com</div>
    </div>
  </div>
</body>
</html>
